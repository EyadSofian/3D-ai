<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ماجد — أفاتار ثلاثي الأبعاد بيتكلم عربي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>
</head>
<body>

<main class="app">

  <!-- ─────────────── المسرح ─────────────── -->
  <section class="stage" id="stage" data-state="idle">
    <div class="halo"></div>
    <div class="ring r1"></div>
    <div class="ring r2"></div>

    <div class="mount" id="avatarMount"></div>
    <div class="floor"></div>

    <div class="boot" id="boot">
      <div class="spinner"></div>
      <p id="bootText">بجهّز المشهد…</p>
    </div>

    <div class="caption" id="caption"></div>

    <div class="badge">
      <span class="dot" id="stateDot" data-state="idle"></span>
      <span id="stateLabel">جاهز</span>
    </div>
  </section>

  <!-- ─────────────── اللوحة ─────────────── -->
  <section class="panel">
    <header class="phead">
      <div>
        <h1>ماجد</h1>
        <p>يسمع · يفهم · يرد بصوته وشفايفه بتتحرك مع الكلام</p>
      </div>
      <button class="ghost" id="diagToggle" type="button" title="تشخيص">⚙</button>
    </header>

    <div class="diag" id="diag" hidden>
      <div id="diagBody"></div>
    </div>

    <div class="log" id="log"></div>

    <div class="controls">
      <button class="mic" id="micBtn" type="button">
        <span class="meter" id="meter"></span>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/>
          <path fill="currentColor" d="M18 11a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.91V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.09A6 6 0 0 0 18 11Z"/>
        </svg>
        <span id="micLabel">ابدأ الكلام</span>
      </button>

      <form class="textrow" id="textForm" autocomplete="off">
        <input id="textInput" type="text" placeholder="أو اكتب هنا…" />
        <button type="submit" aria-label="إرسال">↑</button>
      </form>
    </div>
  </section>

</main>

<script type="module" src="./js/main.js"></script>
</body>
</html>
